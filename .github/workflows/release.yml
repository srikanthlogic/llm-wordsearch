name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test

      - name: Create GitHub Release
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          gh release create "$TAG" \
            --title "Release $TAG" \
            --generate-notes \
            --target "${{ github.sha }}" \
            --latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
