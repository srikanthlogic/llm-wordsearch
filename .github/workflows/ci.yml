name: CI

on:
  push:
    branches: [main, dev, v2]
  pull_request:
    branches: [main, v2]

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint || echo "lint warnings (non-blocking)"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:run
      - run: npm run test:coverage

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level high || echo "audit warnings (non-blocking)"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Scan client bundle for secrets
        run: npm run check:bundle
      - uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/

  integration-test:
    runs-on: ubuntu-latest
    needs: [build]
    env:
      API_KEY: harness-ci-key
      PROXY_PORT: '3000'
      MOCK_LLM_PORT: '9101'
      MOCK_KV_PORT: '9102'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Integration tests (real handlers via harness, Bruno asserts)
        run: npm run test:integration
