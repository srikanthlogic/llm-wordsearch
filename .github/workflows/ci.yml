name: CI

on:
  push:
    branches: [main, dev, v2]
  pull_request:
    branches: [main, v2]

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint || echo "lint warnings (non-blocking)"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:run
      - run: npm run test:coverage

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level high || echo "audit warnings (non-blocking)"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/

  integration-test:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Install & run Bruno integration tests
        run: |
          npm install -g @usebruno/cli 2>/dev/null || true
          if command -v bruno &> /dev/null; then
            jq -n \
              --arg baseUrl "http://localhost:3000" \
              --arg apiKey "${{ secrets.API_KEY }}" \
              --arg model "google/gemini-2.5-flash" \
              --arg prompt "Test prompt" \
              --argjson max_tokens 100 \
              '{baseUrl: $baseUrl, apiKey: $apiKey, model: $model, prompt: $prompt, max_tokens: $max_tokens}' > temp.env.json
            bruno run ./bruno --env temp.env.json || echo "Bruno tests incomplete (non-blocking)"
          else
            echo "Bruno CLI not available — skipping integration tests"
          fi
