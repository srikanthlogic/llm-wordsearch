name: CD

on:
  push:
    branches: [main, dev, v2]

env:
  # Stable staging URL for the dev branch. Change here if the name is taken.
  STAGING_ALIAS: llm-wordsearch-staging.vercel.app

jobs:
  deploy:
    runs-on: ubuntu-latest
    # main -> production; dev/v2 -> staging. GitHub auto-creates these
    # environments on first run; protection rules are optional (repo
    # Settings -> Environments).
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Deploy to Vercel
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN not set — skipping Vercel deployment."
            echo "Set VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID in repo secrets."
            exit 0
          fi
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "Deploying to production (vercel --prod)..."
            npx vercel --prod --token "$VERCEL_TOKEN" --yes
          else
            URL=$(npx vercel --token "$VERCEL_TOKEN" --yes 2>&1 | grep -oE 'https://[a-z0-9-]+\.vercel\.app' | tail -n 1)
            echo "Preview deployment: $URL"
            if [ "$GITHUB_REF" = "refs/heads/dev" ] && [ -n "$URL" ]; then
              echo "Pointing stable staging alias at this build: $STAGING_ALIAS"
              npx vercel alias set "$URL" "$STAGING_ALIAS" --token "$VERCEL_TOKEN"
            fi
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
