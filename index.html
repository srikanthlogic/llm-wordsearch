    <script>
      // Handle initial theme detection before React loads
      (function() {
        const theme = localStorage.getItem('wordSearchTheme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        if (theme === 'dark' || (theme === 'system' && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <!-- Tailwind is compiled at build time (index.css + PostCSS); darkMode:
         'class' lives in tailwind.config.js. The runtime Play CDN was removed
         in #57 — its JIT fallback forced darkMode: 'media' and split the theme.
         Design tokens and component classes live in index.css. -->
