    <script>
      // Handle initial theme detection before React loads
      (function() {
        const theme = localStorage.getItem('wordSearchTheme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        if (theme === 'dark' || (theme === 'system' && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <!-- Tailwind is compiled at build time (index.css + PostCSS); darkMode:
         'class' lives in tailwind.config.js. The runtime Play CDN was removed
         in #57 — its JIT fallback forced darkMode: 'media' and split the theme.
         Design tokens and component classes live in index.css. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Bricolage Grotesque: display face (headings, nav, buttons, grid letters).
         Inter: body and UI text. -->
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="/env.js"></script> <!-- For local development API keys -->
</head>
